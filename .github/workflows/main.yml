name: Python CI

on:
  push:
    branches:
      - jeongtae  # jeongtae 브랜치에 푸시될 때 CI 실행
  pull_request:
    branches:
      - jeongtae  # jeongtae 브랜치로 PR을 보낼 때 CI 실행

jobs:
  test:
    runs-on: ubuntu-latest  # CI 작업은 최신 Ubuntu에서 실행
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2  # GitHub에서 코드를 체크아웃

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'  # Python 3.9 버전 설정

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # requirements.txt에 정의된 라이브러리 설치

      - name: Run tests
        run: |
          python hello.py  # hello.py 실행 (Hello World 출력)
